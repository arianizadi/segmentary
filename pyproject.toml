[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentary"
version = "0.1.0"
description = "Modular semantic-segmentation training, evaluation, and deployment harness"
readme = "README.md"
requires-python = "==3.11.*"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arian Izadi" }]

# Every ordinary dependency is pinned and was resolved together in the reference
# environment. torch/torchvision are deliberately absent because their wheels are
# platform-specific; install a compatible CPU/CUDA/accelerator pair first. The
# [tool.segmentary.install] table records the reproduction host's tested pair, not a
# universal installation command.
dependencies = [
  "transformers==5.15.0",
  "tokenizers==0.22.2",           # transformers 5.15 caps <=0.23.0; 0.23.0 does not exist
  "huggingface-hub==1.27.0",
  "safetensors==0.8.0",
  "accelerate==1.14.0",
  "timm==1.0.28",
  "segmentation-models-pytorch==0.5.0",
  "peft==0.20.0",
  "lightning==2.6.5",          # the project imports `lightning`; the separate
                               # pytorch-lightning distribution would install a
                               # second overlapping copy of the same framework
  "torchmetrics==1.9.0",
  "albumentations==2.0.8",
  "albucore==0.0.24",
  "opencv-python-headless==4.14.0.94",  # pinned to 4.x: albumentations 2.0.8 declares
                                        # only >=4.9.0.80 and was never tested on OpenCV 5
  "numpy==2.4.4",
  "scipy==1.17.1",
  "pillow==12.2.0",
  "pyyaml==6.0.3",
  "tqdm==4.70.0",
  "rich==15.0.0",
  "tensorboard==2.21.0",
]

[project.urls]
Documentation = "https://github.com/arianizadi/segmentary/tree/main/docs"
Repository = "https://github.com/arianizadi/segmentary"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.2", "mypy==1.18.2"]
# Export extras: install separately. `tensorrt` (bare) now resolves to the cu13
# build which requires driver >= 580 -- always use the -cu12 package here.
export = [
  "onnx==1.22.0",
  # ORT >=1.27 PyPI GPU wheels require CUDA 13; 1.26 is the final CUDA 12.8 line.
  "onnxruntime-gpu==1.26.0",
  # TensorRT 11 removed FP16 builder flags; encode FP16 types into ONNX instead.
  "onnxconverter-common==1.16.0",
  "tensorrt-cu12==11.2.1.2",
  "polygraphy==0.53.4",
]

[project.scripts]
segmentary-train = "segmentary.train:main"
segmentary-eval = "segmentary.eval:main"
segmentary-export = "segmentary.export:main"
segmentary-init = "segmentary.init_project:main"
segmentary-verify = "segmentary.verify:main"
segmentary-overfit = "segmentary.overfit:main"
segmentary-make-split = "segmentary.make_split:main"
segmentary-table = "segmentary.results_table:main"
segmentary-models = "segmentary.model_catalog:main"
segmentary-progress = "segmentary.progress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segmentary = ["templates/**/*.yaml", "templates/**/*.md", "templates/**/.gitignore"]

[tool.setuptools.data-files]
"share/segmentary/configs" = ["configs/base.yaml"]
"share/segmentary/configs/models" = ["configs/models/*.yaml", "configs/models/README.md"]
"share/segmentary/configs/curricula" = ["configs/curricula/*.yaml", "configs/curricula/README.md"]
"share/segmentary/configs/examples" = ["configs/examples/*.yaml"]
"share/segmentary/taxonomy" = ["taxonomy/README.md"]
"share/segmentary/taxonomy/cityscapes19" = ["taxonomy/cityscapes19/*.yaml", "taxonomy/cityscapes19/README.md"]
"share/segmentary/taxonomy/rail_union" = ["taxonomy/rail_union/*.yaml", "taxonomy/rail_union/README.md"]
"share/segmentary/taxonomy/example" = ["taxonomy/example/*.yaml", "taxonomy/example/README.md"]
"share/segmentary/splits" = ["splits/*.json"]

[tool.segmentary.install]
torch-index = "https://download.pytorch.org/whl/cu128"
torch = "torch==2.11.0 torchvision==0.26.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: touches real datasets on disk", "gpu: requires a CUDA device"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/segmentary"]
# torch, lightning, albumentations, timm and smp ship partial or absent stubs.
# Chasing those is not what this gate is for.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# This is a ratchet, not a retrofit. It keeps NEW type errors out of the 57
# modules that are already clean -- including every metric, objective, and
# inference path -- rather than pretending the whole tree is annotated. The
# modules below carry pre-existing errors (82 at the time of writing, mostly
# unions from YAML parsing and dataclass reflection). Clear a module, delete its
# line, and it can never regress. Do not add to this list.
[[tool.mypy.overrides]]
module = [
  "segmentary.config",
  "segmentary.curriculum",
  "segmentary.data.folder",
  "segmentary.data.loaders",
  "segmentary.engine.losses",
  "segmentary.engine.module",
  "segmentary.eval",
  "segmentary.export",
  "segmentary.models.components",
  "segmentary.models.factory",
  "segmentary.overfit",
  "segmentary.performance",
  "segmentary.progress",
  "segmentary.results_table",
  "segmentary.taxonomy",
  "segmentary.verify",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
"scripts/*" = ["E402"]        # sys.path insert must precede segmentary imports
