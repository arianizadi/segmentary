# =============================================================================
# Canonical label space: cityscapes19
# =============================================================================
# The standard Cityscapes 19-class evaluation protocol, unchanged.
#
# PURPOSE: this space exists so milestone 4 -- "SegFormer-B2 on Cityscapes within
# ~2 mIoU of the published number" -- is a real reproduction rather than an
# approximate one. Published Cityscapes mIoU is always reported on exactly these
# 19 classes with exactly these ignore rules. If you evaluate in `rail_union`
# instead, the numbers are not comparable to any paper and the reference check is
# worthless.
#
# Use this space for: the reference implementation check, and any table that
# quotes a literature baseline.
# Use `rail_union` for: every staged-transfer experiment.
#
# ids/trainIds/colors verified against cityscapesScripts/helpers/labels.py.
# =============================================================================

name: cityscapes19
description: >-
  Standard Cityscapes 19-class protocol (trainIds 0..18). For literature
  comparison only.
ignore_index: 255

classes:
  - {id: 0,  name: road,          color: [128,  64, 128]}
  - {id: 1,  name: sidewalk,      color: [244,  35, 232]}
  - {id: 2,  name: building,      color: [ 70,  70,  70]}
  - {id: 3,  name: wall,          color: [102, 102, 156]}
  - {id: 4,  name: fence,         color: [190, 153, 153]}
  - {id: 5,  name: pole,          color: [153, 153, 153]}
  - {id: 6,  name: traffic-light, color: [250, 170,  30]}
  - {id: 7,  name: traffic-sign,  color: [220, 220,   0]}
  - {id: 8,  name: vegetation,    color: [107, 142,  35]}
  - {id: 9,  name: terrain,       color: [152, 251, 152]}
  - {id: 10, name: sky,           color: [ 70, 130, 180]}
  - {id: 11, name: person,        color: [220,  20,  60]}
  - {id: 12, name: rider,         color: [255,   0,   0]}
  - {id: 13, name: car,           color: [  0,   0, 142]}
  - {id: 14, name: truck,         color: [  0,   0,  70]}
  - {id: 15, name: bus,           color: [  0,  60, 100]}
  - {id: 16, name: train,         color: [  0,  80, 100]}
  - {id: 17, name: motorcycle,    color: [  0,   0, 230]}
  - {id: 18, name: bicycle,       color: [119,  11,  32]}

thin_classes: [5, 6, 7]
