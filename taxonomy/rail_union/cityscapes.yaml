# Cityscapes gtFine *_labelIds.png  ->  rail_union canonical ids.
#
# Source of native ids (verified, not recalled):
#   https://raw.githubusercontent.com/mcordts/cityscapesScripts/master/
#     cityscapesscripts/helpers/labels.py
# Parsed 34 Label rows, ids 0..33. Confirmed empirically against the extracted
# gtFine PNGs: uint8, mode L, 1024x2048, observed id set subset of 0..33.
#
# NOTE: gtFine ships *_labelIds.png only -- there are no *_labelTrainIds.png
# files unless you run cityscapesScripts. This LUT maps raw labelIds directly,
# so no preprocessing step is required and no intermediate file can go stale.

space: rail_union
dataset: cityscapes
source: cityscapesScripts/helpers/labels.py (labelIds, ids 0..33)

# Any native id not listed below becomes ignore_index.
default: 255

map:
  # --- void group: all ignored (CS ignoreInEval=True) ----------------------
  0:  255   # unlabeled
  1:  255   # ego vehicle
  2:  255   # rectification border
  3:  255   # out of roi
  4:  255   # static
  5:  255   # dynamic
  6:  255   # ground

  # --- flat ----------------------------------------------------------------
  7:  0     # road          -> road
  8:  1     # sidewalk      -> sidewalk
  9:  255   # parking       -> ignore (CS ignoreInEval; no RailSem19 counterpart)
  10: 255   # rail track    -> ignore  [SEE cityscapes_railbridge.yaml]
            #   Cityscapes DOES have a `rail track` class and it is semantically
            #   identical to rail_union `rail-track` (id 16). It is ignored here
            #   to preserve comparability with the standard 19-class protocol.
            #   The railbridge variant turns it on as an explicit transfer ablation.

  # --- construction --------------------------------------------------------
  11: 2     # building      -> construction   [MERGE]
  12: 2     # wall          -> construction   [MERGE]
  13: 3     # fence         -> fence
  14: 255   # guard rail    -> ignore  [SEE cityscapes_railbridge.yaml]
            #   RailSem19 `rail-raised` is defined as "metal rail, both rails and
            #   guard rails", so CS guard rail is a legitimate bridge to id 17.
  15: 255   # bridge        -> ignore (CS ignoreInEval)
  16: 255   # tunnel        -> ignore (CS ignoreInEval)

  # --- object --------------------------------------------------------------
  17: 4     # pole          -> pole
  18: 255   # polegroup     -> ignore (CS ignoreInEval)
  19: 5     # traffic light -> traffic-light
  20: 6     # traffic sign  -> traffic-sign

  # --- nature --------------------------------------------------------------
  21: 7     # vegetation    -> vegetation
  22: 8     # terrain       -> terrain

  # --- sky -----------------------------------------------------------------
  23: 9     # sky           -> sky

  # --- human ---------------------------------------------------------------
  24: 10    # person        -> human          [MERGE]
  25: 10    # rider         -> human          [MERGE]

  # --- vehicle -------------------------------------------------------------
  26: 11    # car           -> car
  27: 12    # truck         -> truck          [MERGE]
  28: 12    # bus           -> truck          [MERGE]  RS truck includes busses
  29: 12    # caravan       -> truck          [MERGE]  RS truck includes caravans
  30: 12    # trailer       -> truck          [MERGE]  RS truck includes trailers
  31: 15    # train         -> on-rails
  32: 13    # motorcycle    -> motorcycle
  33: 14    # bicycle       -> bicycle

# Every canonical id produced by more than one native id MUST be declared here,
# with a reason. Undeclared collisions are a hard validation error -- that is
# what stops a silent taxonomy bug from reaching the loss.
allow_merge:
  2:  "RailSem19 `construction` explicitly includes the Cityscapes wall label."
  10: "RailSem19 `human` explicitly includes Cityscapes person and rider."
  12: "RailSem19 `truck` is defined as trucks, busses, caravans, trailers and
       construction vehicles."
