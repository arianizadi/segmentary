name: inference-checker
on:
  push:
    branches: [main]
    paths:
      - 'tools/inference-checker/**'
      - 'scripts/inspect.sh'
      - '.github/workflows/viewer.yml'
  pull_request:
    paths:
      - 'tools/inference-checker/**'
      - 'scripts/inspect.sh'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: [self-hosted, Linux, X64, segmentary]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/inference-checker
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable runner user tools
        # unzip is installed without root in the runner user's ~/.local/bin.
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/unzip" -v
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run build
