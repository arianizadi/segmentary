# COCO-panoptic pretrained Swin-T backbone/query model; target classifier adapted.
task: instance
model:
  arch: mask2former_swin_tiny
  checkpoint: facebook/mask2former-swin-tiny-coco-panoptic
train:
  images: ../../data/my-instances/train
  annotations: ../../data/my-instances/instances_train.json
val:
  images: ../../data/my-instances/val
  annotations: ../../data/my-instances/instances_val.json
output: ../../runs/mask2former-instance
image_size: [640, 640]
max_steps: 1000
val_every: 100
batch_size: 1
gradient_accumulation: 1
precision: float32
lr: 0.0001
device: cpu
