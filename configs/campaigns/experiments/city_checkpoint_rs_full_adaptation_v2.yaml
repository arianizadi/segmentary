# Quality-oriented Cityscapes -> RailSem19 adaptation.
#
# The launcher replaces the checkpoint placeholder with the exact verified
# 40,000-iteration Cityscapes checkpoint for the same model. The incompatible
# classifier is reset. Reused backbone parameters retain the conservative 0.1x
# stage scale, while model-declared decoder/head parameters receive their normal
# task-training learning rate.
#
# Retain and evaluate both the 20,000- and 40,000-iteration Rail checkpoints.
# They represent 60,000 and 80,000 cumulative optimizer iterations respectively
# after including the reused 40,000-iteration Cityscapes source stage.
name: city_checkpoint_rs_full_adaptation_v2
space: rail_union
loss: {aux: lovasz, aux_weight: 0.5}
stages:
  - name: railsem19
    data:
      - {name: railsem19, root: data/railsem19, split_file: splits/railsem19_seed0.json}
    init_from: /dependency/cityscapes/last.ckpt
    reset_head: true
    iters: 40000
    lr_scale: 0.1
    head_group_lr_scale: 1.0
