# Auditable scope for the public all-model benchmark campaign.
#
# Every shipped model recipe appears exactly once. Tests fail when a recipe is
# added or removed without updating this manifest and its documentation target.
schema_version: 1
name: all_models_cityscapes_railsem19

# Missing cells are scheduled in this order. It is a capacity/architecture
# prior, not a benchmark claim; once compatible results exist, measured mIoU is
# used as the primary ordering signal and this list breaks ties.
priority_order:
  - eomt_dinov3_large
  - eomt_large
  - hf_auto_beit_base_ade
  - upernet_convnext
  - segformer_b5
  - hf_auto_upernet_swin_tiny
  - hrnet_w48_ocr
  - native_resnet101_uper
  - segformer_b2
  - smp_upernet_resnet101
  - smp_deeplabv3plus_resnet101
  - deeplabv3plus_r101
  - native_convnext_tiny_uper
  - native_convnext_tiny_channelmapper_dpt
  - smp_pan_resnext50
  - native_resnet50_deeplabv3plus
  - native_resnet50_fpn_ocr
  - native_resnet50_psp
  - native_resnet50_aspp
  - smp_deeplabv3_resnet50
  - smp_fpn_resnet50
  - smp_upernet_mit_b0
  - segformer_b0
  - hf_auto_segformer_b0
  - smp_unet_resnet34
  - smp_unetplusplus_efficientnet_b0
  - smp_manet_efficientnet_b0
  - native_efficientnet_b0_deeplabv3plus
  - hf_auto_mobilevitv2_deeplabv3
  - hf_auto_mobilevit_xxs_deeplabv3
  - hf_auto_mobilenetv2_deeplabv3
  - native_mobilenetv3_large_deeplabv3plus
  - native_mobilenetv3_large_lraspp
  - smp_pspnet_mobilenet_v2
  - smp_linknet_mobilenet_v2
  - native_resnet18_fpn_segformer_aux
  - native_resnet18_fpn_fcn

protocols:
  cityscapes:
    label: Cityscapes
    curriculum: configs/curricula/reference_cityscapes19.yaml
    final_stage: cityscapes
    evaluation_dataset: cityscapes
    evaluation_mapping: cityscapes
    evaluation_split: val
    evaluation_space: cityscapes19

  railsem19:
    label: RailSem19
    curriculum: configs/curricula/rs_only.yaml
    final_stage: railsem19
    evaluation_dataset: railsem19
    evaluation_mapping: railsem19
    evaluation_split: val
    evaluation_split_file: splits/railsem19_seed0.json
    evaluation_space: rail_union

  cityscapes_to_railsem19:
    label: Cityscapes to RailSem19
    curriculum: configs/curricula/cs_rs.yaml
    final_stage: railsem19
    evaluation_dataset: railsem19
    evaluation_mapping: railsem19
    evaluation_split: val
    evaluation_split_file: splits/railsem19_seed0.json
    evaluation_space: rail_union

models:
  - id: deeplabv3plus_r101
    config: configs/models/deeplabv3plus_r101.yaml
    readme: docs/catalog/models/builtin-deeplabv3plus-r101-alias/README.md
    alias_of: smp_deeplabv3plus_resnet101
