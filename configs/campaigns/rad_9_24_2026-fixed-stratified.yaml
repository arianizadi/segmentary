# rad_9_24_2026 arm "fixed-stratified": same recipes and protocols as paul-test-rtis-fullstats, seed 0 only.
# GPUs are not chosen here: plan_rtis_campaign.py --gpus freezes the allowlist into plan.json.
name: rad_9_24_2026-fixed-stratified
dataset: rad_9_24_2026-fixed-stratified
dataset_config: configs/datasets/rad_9_24_2026-fixed-stratified.yaml
model_catalog: configs/campaigns/all_models_cityscapes_railsem19.yaml
status: full-statistics
publisher: false
# Top 10 by best overall validation mIoU (Quality table, any initialization path) in
# docs/results/paul-test-rtis/v2/README.md, chosen 2026-10-04.
models:
- eomt_large
- eomt_dinov3_large
- segformer_b5
- hrnet_w48_ocr
- segformer_b2
- upernet_convnext
- smp_deeplabv3plus_resnet101
- smp_fpn_resnet50
- smp_upernet_resnet101
- native_convnext_tiny_uper
seeds:
- 0
target_steps: 4000
batch_size: 2
accumulation: 8
validation_interval: 250
checkpoint_interval: 500
early_stopping_patience: 5
early_stopping_min_delta: 0.001
num_workers: 2
protocols:
  rtis_only:
    label: Recipe pretrained initialization -> RTIS
    source_protocol: null
  cityscapes_to_rtis:
    label: Cityscapes -> RTIS
    source_protocol: cityscapes
  railsem19_to_rtis:
    label: RailSem19 -> RTIS
    source_protocol: railsem19
  cityscapes_to_railsem19_to_rtis:
    label: Cityscapes -> RailSem19 -> RTIS
    source_protocol: cityscapes_to_railsem19
collection_contract: rtis-full-statistics-v1
selection_metric: val_iou/mud-pumping
