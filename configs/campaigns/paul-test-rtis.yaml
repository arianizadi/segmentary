# Design manifest consumed by scripts/plan_rtis_campaign.py, not the City/Rail runner.
name: paul-test-rtis
dataset_config: configs/datasets/paul-test-rtis.yaml
model_catalog: configs/campaigns/all_models_cityscapes_railsem19.yaml
status: pilot
publisher: true
seeds: [0]
# Initial pilot budget. Review before a full comparison; not the old 40k protocol.
target_steps: 4000
batch_size: 2
accumulation: 8
validation_interval: 500
num_workers: 2
protocols:
  rtis_only:
    label: Pretrained backbone -> RTIS
    source_protocol: null
  cityscapes_to_rtis:
    label: Cityscapes -> RTIS
    source_protocol: cityscapes
  railsem19_to_rtis:
    label: RailSem19 -> RTIS
    source_protocol: railsem19
  cityscapes_to_railsem19_to_rtis:
    label: Cityscapes -> RailSem19 -> RTIS
    source_protocol: cityscapes_to_railsem19
