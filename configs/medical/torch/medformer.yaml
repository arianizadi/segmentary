  base_chan: 32
  map_size:
  - 4
  - 4
  - 4
  chan_num:
  - 64
  - 128
  - 256
  - 320
  - 256
  - 128
  - 64
  - 32
  conv_num:
  - 2
  - 1
  - 0
  - 0
  - 0
  - 1
  - 2
  - 2
  trans_num:
  - 0
  - 1
  - 4
  - 6
  - 4
  - 1
  - 0
  - 0
  num_heads:
  - 1
  - 4
  - 8
  - 10
  - 8
  - 4
  - 1
  - 1
  fusion_depth: 2
  fusion_dim: 320
  fusion_heads: 10
  expansion: 4
gpu: '0'
seed: 0
workers: 2
batch_size: 2
epochs: 100
steps_per_epoch: 100
learning_rate: 0.0003
