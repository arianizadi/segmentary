# BiSeNet V1 (Yu et al., ECCV 2018) with the ResNet-18 context path: the widely
# benchmarked real-time variant (~13.4M parameters including both auxiliary
# heads). The context path is timm's resnet18.tv_in1k (torchvision ImageNet
# weights, as upstream); spatial path, attention/fusion modules and all three
# heads start fresh. Training adds the paper's two context-path auxiliary
# losses (weight 1.0 each); evaluation and export run only the fused head.
model:
  arch: bisenetv1_r18
  tuning: full
  head: unified_head
# The paper and CoinCheung's reference use SGD (lr 1e-2..2.5e-2, poly 0.9).
# Segmentary's optimizer is AdamW + poly for every catalog arm, so this uses the
# same pretrained-CNN rate as the native ResNet recipes: 1e-4 on the ImageNet
# trunk and 10x on the freshly initialized BiSeNet modules.
optim:
  backbone_lr: 1.0e-4
  head_lr_mult: 10.0
  llrd: 1.0
