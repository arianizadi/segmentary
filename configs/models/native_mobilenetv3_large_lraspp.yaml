# Lightweight native LR-ASPP with an exact timm ImageNet-1k backbone tag.
model:
  arch: native
  tuning: full
  head: unified_head
  native:
    task: multiclass
    backbone:
      kind: timm
      name: mobilenetv3_large_100.ra_in1k
      weights: pretrained
      out_indices: [1, 2, 3, 4]
      in_channels: 3
    neck:
      kind: identity
    head:
      kind: lraspp
      low_index: 0
      high_index: 3
      channels: 128
      dropout: 0.1
      norm: group
      activation: relu
    auxiliary_heads: []

optim:
  backbone_lr: 1.0e-4
  head_lr_mult: 10.0
  llrd: 1.0
