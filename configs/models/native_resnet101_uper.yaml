# Higher-capacity native UPer recipe with an exact timm ImageNet-1k tag.
model:
  arch: native
  tuning: full
  head: unified_head
  native:
    task: multiclass
    backbone:
      kind: timm
      name: resnet101.a1_in1k
      weights: pretrained
      out_indices: [1, 2, 3, 4]
      in_channels: 3
    neck:
      kind: identity
    head:
      kind: uper
      in_indices: [0, 1, 2, 3]
      channels: 256
      pool_bins: [1, 2, 3, 6]
      dropout: 0.1
      norm: group
      activation: relu
    auxiliary_heads: []

optim:
  backbone_lr: 1.0e-4
  head_lr_mult: 10.0
  llrd: 1.0
