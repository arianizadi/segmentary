# The full staged curriculum: Cityscapes -> RailSem19 -> custom.
#
# BLOCKED until the custom dataset exists. Set the custom root and generate
# custom/splits.json with scripts/make_custom_split.py (split BY RUN, not by
# frame) before running this.
#
# Chain resolution is automatic: `make train CURRICULUM=cs_rs_custom` runs all
# three stages in order and threads each stage's final checkpoint into the next
# via init_from: previous.

name: cs_rs_custom
space: rail_union
loss: {aux: lovasz, aux_weight: 0.5}

stages:
  - name: cityscapes
    data:
      - {name: cityscapes, root: data/cityscapes}
    init_from: pretrained
    iters: 40000

  - name: railsem19
    data:
      - {name: railsem19, root: data/railsem19, split_file: splits/railsem19_seed0.json}
    init_from: previous
    iters: 20000
    lr_scale: 0.1

  - name: custom
    data:
      - {name: custom, root: data/custom_rail}
    init_from: previous
    iters: 10000
    lr_scale: 0.1
