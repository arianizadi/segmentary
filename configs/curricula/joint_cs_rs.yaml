# Joint baseline: one mixed loader over Cityscapes + RailSem19 instead of stages.
# Only possible with unified_head -- each sample carries its own active-class mask
# and the loss masks per sample. sample_weights makes the 2975-vs-6800 size
# imbalance an explicit knob rather than an accident.
name: joint_cs_rs
space: rail_union
loss: {aux: lovasz, aux_weight: 0.5}
model: {head: unified_head}
stages:
  - name: joint
    data:
      - {name: cityscapes, root: data/cityscapes}
      - {name: railsem19, root: data/railsem19, split_file: splits/railsem19_seed0.json}
    sample_weights: {cityscapes: 0.5, railsem19: 0.5}
    init_from: pretrained
    iters: 60000
