# verified against the arm's samples.
#
# Categories (exactly one per image):
# - cab-view: forward-facing view from a camera mounted on/in a rail vehicle (locomotive
#   cab, train front, dashcam), looking along the track towards the horizon from vehicle
#   height; often shows cab parts, wipers, a cowl, or a speed/time overlay. This is the
#   deployment scenario (a camera on a moving train).
# - track-level: handheld or ground-level photo of the track bed/rails/sleepers from close
#   range or walking on/next to the track (camera near the ground or pointed down), even if
#   the track converges to a horizon.
# - other: anything else -- wayside/side views, platforms or stations photographed from
#   beside the track, bridges, flooded scenes from off-track, aerial, stills that are not
#   along the track.
# When unsure between cab-view and track-level, camera height and motion cues decide: cab
# views are ~2-3 m high, centred on the track, with both rails converging symmetrically and
# usually the far scenery visible; handheld shots are low, tilted, off-centre, close-up.
#
# Evidence level: VISUAL JUDGEMENT ONLY, not recording provenance. Each image was labelled
# by two independent labelling passes, both AI model (Claude) subagents working from image
# contact sheets, not human annotators; being the same model, their agreement is weaker
# evidence than two independent people. Disagreements and low-confidence cases were adjudicated
# (method field; the adjudication reason is in note). Agreed notes join the two labellers'
# remarks with ' | '.
