# Scene group and split for the 22 rad_9_24_2026 images that are not in paul-test-rtis
# (v1 or v2). Consumed by scripts/make_rad_splits.py grouped, keyed by the sha256 of the
# delivered image file; `stem` is informational and is verified against the delivery.
#
# Evidence level: VISUAL ONLY. Recording provenance is unconfirmed by the annotator.
# Markers used: a black curved cab cowl in the top corners, a "Vmax: NN Km/h" overlay
# bottom-right, a pig watermark bottom-left, and scenery. Each of the 22 images was
# inspected by eye against the reference frames of the groups named below.
#
# Decisions:
# - 0251, 0253-0261: cowl + Vmax overlay + sunny alpine scenery, the same recording
#   signature as the ten held-out test frames of sunny-mountain-cab-view (0114-0123).
#   Assigned to that group and therefore to TEST, so that test does not share a
#   recording with train. Note that train image 0252 (sunny-mountain-stations, v1 key
#   no_anomalies_0749) carries the same cowl and sits between 0251 and 0253 in the
#   delivery order; that pre-existing v1/v2 leak is left as is.
# - 0250: large urban terminus platform, no cowl, no overlay; sort neighbour of 0252 ->
#   sunny-mountain-stations, train.
# - 0174: dark green roadside with the pig watermark seen only in
#   green-roadside-cab-view (train).
# - 0179, 0180, 0181, 0182, 0184: Vmax overlay without a cowl, a signature seen only in
#   train (sunny-mainline-cab-view) -> that group, train.
# - 0175, 0176, 0177, 0178, 0183: no marker shared with any val/test image; 0183 looks
#   like the same station as train 0228 (sunny-mountain-stations). Kept together as a
#   new train group rather than guessed into existing ones.
